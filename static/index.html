<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gary RéDeaux</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #111118; --border: #1e1e2a;
    --accent: #7b6ef6; --accent2: #4ecdc4;
    --text: #e8e6f0; --muted: #6b6880;
    --user-bg: #1a1a2e; --gary-bg: #111118;
  }
  html, body { height: 100dvh; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px; overflow: hidden; }
  .app { display: flex; height: 100dvh; max-width: 1200px; margin: 0 auto; }

  /* SIDEBAR */
  .sidebar { width: 260px; min-width: 260px; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem 1rem; gap: 1rem; overflow: hidden; }
  .gary-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600; }
  .gary-subtitle { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.15rem; }
  .new-chat-btn { background: var(--accent); color: white; border: none; padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 0.8rem; letter-spacing: 0.05em; transition: opacity 0.2s; }
  .new-chat-btn:hover { opacity: 0.85; }
  .voice-toggle { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--muted); cursor: pointer; padding: 0.4rem 0; }
  .voice-toggle input { accent-color: var(--accent); cursor: pointer; }
  .voice-toggle:hover { color: var(--text); }
  .threads-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 0 0.25rem; }
  .threads-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.15rem; }
  .threads-list::-webkit-scrollbar { width: 4px; }
  .threads-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .thread-item { display: flex; align-items: center; gap: 0.25rem; padding: 0.35rem 0.25rem 0.35rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.75rem; color: var(--muted); transition: all 0.15s; border: 1px solid transparent; flex-shrink: 0; }
  .thread-item.in-folder { margin-left: 0.9rem; }
  .thread-item:hover { background: var(--surface); color: var(--text); }
  .thread-item.active { background: var(--surface); color: var(--text); border-color: var(--border); }
  .thread-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* SIDEBAR ORGANIZING: search, sections, folders, menus */
  .search-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.75rem; padding: 0.5rem 0.75rem; outline: none; }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
  .section-label { display: flex; align-items: center; justify-content: space-between; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 0.75rem 0.25rem 0.25rem; flex-shrink: 0; }
  .section-label:first-child { padding-top: 0; }
  .section-btn { background: none; border: none; color: var(--accent); font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.05em; cursor: pointer; padding: 0.15rem 0.25rem; }
  .section-btn:hover { color: var(--text); }
  .folder-header { display: flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.25rem 0.35rem 0.5rem; border-radius: 6px; cursor: pointer; font-size: 0.75rem; color: var(--text); flex-shrink: 0; }
  .folder-header:hover { background: var(--surface); }
  .folder-caret { width: 0.8rem; color: var(--muted); font-size: 0.6rem; }
  .folder-count { color: var(--muted); font-size: 0.65rem; }
  .menu-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; line-height: 1; padding: 0.2rem 0.4rem; border-radius: 4px; opacity: 0; flex-shrink: 0; }
  .thread-item:hover .menu-btn, .folder-header:hover .menu-btn, .thread-item.active .menu-btn { opacity: 1; }
  .menu-btn:hover { color: var(--text); background: var(--border); }
  @media (hover: none) { .menu-btn { opacity: 1; } }
  .pop-menu { position: fixed; z-index: 200; min-width: 180px; max-width: 260px; max-height: 60dvh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.3rem; box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: none; }
  .pop-menu.open { display: block; }
  .pop-item { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.75rem; padding: 0.55rem 0.7rem; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pop-item:hover { background: var(--border); }
  .pop-item.danger { color: #ff6b6b; }
  .pop-item.muted { color: var(--muted); cursor: default; }
  .pop-item.muted:hover { background: none; }
  .pop-divider { height: 1px; background: var(--border); margin: 0.25rem 0; }
  .search-result { padding: 0.5rem 0.75rem; border-radius: 6px; cursor: pointer; border: 1px solid transparent; flex-shrink: 0; }
  .search-result:hover, .search-result.active { background: var(--surface); border-color: var(--border); }
  .search-result-title { font-size: 0.75rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-result-snippet { font-size: 0.68rem; color: var(--muted); line-height: 1.45; margin-top: 0.2rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .search-result-meta { font-size: 0.6rem; color: var(--muted); margin-top: 0.2rem; opacity: 0.8; }
  .search-result mark { background: rgba(123,110,246,0.35); color: var(--text); border-radius: 2px; padding: 0 1px; }
  .sidebar-note { font-size: 0.7rem; color: var(--muted); padding: 0.5rem 0.25rem; }
  .bubble.search-hit { border-color: var(--accent) !important; box-shadow: 0 0 0 2px rgba(123,110,246,0.35); }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.75rem; }
  .header-text { flex: 1; text-align: center; }
  .header h1 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 600; background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header p { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .messages { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .message { display: flex; gap: 0.75rem; max-width: 85%; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { margin-left: auto; flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; border: 1px solid var(--border); background: var(--surface); }
  .bubble { padding: 0.75rem 1rem; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; font-size: 0.85rem; }
  .message.user .bubble { background: var(--user-bg); border: 1px solid var(--border); border-top-right-radius: 2px; }
  .message.gary .bubble { background: var(--gary-bg); border: 1px solid var(--border); border-top-left-radius: 2px; }
  .message.gary .bubble em { color: var(--muted); font-style: italic; }
  .timestamp { font-size: 0.65rem; color: var(--muted); margin-top: 0.25rem; padding: 0 0.25rem; }
  .message.user .timestamp { text-align: right; }
  .message.gary .timestamp { text-align: left; }
  .download-pdf-btn { display: inline-block; margin-top: 0.4rem; padding: 0.25rem 0.6rem; background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.65rem; cursor: pointer; transition: all 0.2s; }
  .download-pdf-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .typing { display: flex; gap: 4px; padding: 0.75rem 1rem; background: var(--gary-bg); border: 1px solid var(--border); border-radius: 10px; border-top-left-radius: 2px; width: fit-content; }
  .typing span { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; color: var(--muted); }
  .empty-state .icon { font-size: 2.5rem; opacity: 0.4; }
  .empty-state p { font-size: 0.75rem; letter-spacing: 0.05em; }

  /* INPUT */
  .input-area { padding: 1rem 2rem 1.5rem; border-top: 1px solid var(--border); display: flex; gap: 0.75rem; align-items: flex-end; }
  .input-wrap { flex: 1; }
  textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.85rem; padding: 0.75rem 1rem; resize: none; min-height: 44px; max-height: 120px; line-height: 1.5; outline: none; transition: border-color 0.2s; }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }
  .send-btn { background: var(--accent); color: white; border: none; padding: 0.65rem 1.25rem; border-radius: 8px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 0.8rem; transition: opacity 0.2s; white-space: nowrap; height: 44px; }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* HAMBURGER */
  .hamburger { display: none; background: none; border: none; cursor: pointer; color: var(--text); font-size: 1.3rem; padding: 0.25rem; line-height: 1; flex-shrink: 0; }

  /* MIC */
  .mic-btn { background: var(--surface); color: var(--muted); border: 1px solid var(--border); width: 44px; height: 44px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
  .mic-btn:hover { color: var(--text); border-color: var(--accent); }
  .mic-btn.listening { background: #3a1a1a; border-color: #ff4444; color: #ff4444; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,68,68,0.3); } 50% { box-shadow: 0 0 0 6px rgba(255,68,68,0); } }

  /* UPLOAD */
  .upload-btn { background: var(--surface); color: var(--muted); border: 1px solid var(--border); width: 44px; height: 44px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
  .upload-btn:hover { color: var(--text); border-color: var(--accent2); }
  .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .file-preview { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.75rem; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; }
  .file-preview .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .file-preview .remove-file { cursor: pointer; color: var(--muted); font-size: 0.9rem; flex-shrink: 0; }
  .file-preview .remove-file:hover { color: #ff4444; }

  /* DRAWER */
  .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; }
  .drawer-overlay.open { display: block; }
  .drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--surface); border-right: 1px solid var(--border); z-index: 101; display: flex; flex-direction: column; padding: 1.5rem 1rem; gap: 1rem; transform: translateX(-100%); transition: transform 0.25s ease; overflow-y: auto; }
  .drawer.open { transform: translateX(0); }
  .drawer-close { align-self: flex-end; background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; padding: 0.25rem; margin-bottom: -0.5rem; }
  .drawer-close:hover { color: var(--text); }

  /* MOBILE */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .hamburger { display: block; }
    .mic-btn { display: flex; }
    .messages { padding: 1rem; }
    .input-area { padding: 0.75rem 1rem calc(1rem + env(safe-area-inset-bottom)); }
    .header { padding: 0.75rem 1rem; }
    .header h1 { font-size: 1.4rem; }
    .message { max-width: 95%; }
  }
  @media (min-width: 769px) {
    .mic-btn { display: none; }
    .header-text { text-align: center; }
  }
</style>
</head>
<body>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="drawer-close" onclick="closeDrawer()">✕</button>
  <div><div class="gary-title">🎩 Gary RéDeaux</div><div class="gary-subtitle">He simply arrived.</div></div>
  <button class="new-chat-btn" onclick="newChat(); closeDrawer()">+ New Chat</button>
  <label class="voice-toggle"><input type="checkbox" id="voiceToggleMobile" onchange="syncVoice(this)"> 🔊 Voice (Gary speaks)</label>
  <input class="search-input" type="search" placeholder="Search all chats..." oninput="onSearchInput(this)">
  <div class="threads-list" id="threadsListMobile"></div>
</div>

<div class="app">
  <div class="sidebar">
    <div><div class="gary-title">🎩 Gary RéDeaux</div><div class="gary-subtitle">He simply arrived.</div></div>
    <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
    <label class="voice-toggle"><input type="checkbox" id="voiceToggle" onchange="syncVoice(this)"> 🔊 Voice (Gary speaks)</label>
    <input class="search-input" type="search" placeholder="Search all chats..." oninput="onSearchInput(this)">
    <div class="threads-list" id="threadsList"></div>
  </div>

  <div class="main">
    <div class="header">
      <button class="hamburger" onclick="openDrawer()">☰</button>
      <div class="header-text">
        <h1>Gary RéDeaux</h1>
        <p>British · Posh · Keeping receipts since 2024</p>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="icon">🎩</div>
        <p>Say something to Gary.</p>
      </div>
    </div>
    <div class="input-area">
      <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Voice input">🎤</button>
      <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()" title="Upload files">📎</button>
      <input type="file" id="fileInput" style="display:none" accept="image/*,.pdf,.txt,.md,.csv,.json,.html,.css,.js,.xml,.docx" multiple onchange="handleFileSelect(event)">
      <div class="input-wrap">
        <div id="filePreview" style="display:none" class="file-preview">
          <span>📄</span>
          <span class="file-name" id="filePreviewName"></span>
          <span class="remove-file" onclick="clearFile()" title="Remove files">✕</span>
        </div>
        <textarea id="msgInput" placeholder="Say something to Gary..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<audio id="audioPlayer" style="display:none;"></audio>
<div class="pop-menu" id="popMenu"></div>

<script>
  let currentThreadId = null;
  let isLoading = false;
  let recognition = null;
  let isListening = false;
  let voiceEnabled = false;

  function syncVoice(el) {
    voiceEnabled = el.checked;
    document.getElementById('voiceToggle').checked = voiceEnabled;
    document.getElementById('voiceToggleMobile').checked = voiceEnabled;
  }

  function openDrawer() {
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawerOverlay').classList.add('open');
  }

  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerOverlay').classList.remove('open');
  }

  function formatTimestamp(isoString) {
    if (!isoString) return '';
    const d = new Date(isoString);
    const now = new Date();
    const diffDays = Math.floor((now - d) / (1000 * 60 * 60 * 24));
    const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (diffDays === 0) return time;
    if (diffDays === 1) return 'Yesterday ' + time;
    if (diffDays < 7) return d.toLocaleDateString([], { weekday: 'short' }) + ' ' + time;
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + time;
  }

  // -- SIDEBAR: pinned, folders, unfiled chats, search --------------------------

  const LIST_IDS = ['threadsList', 'threadsListMobile'];
  let threadsCache = [];
  let foldersCache = [];
  let searchQuery = '';
  let searchTimer = null;
  let pendingHighlight = null;
  let openFolders = new Set();
  try { openFolders = new Set(JSON.parse(localStorage.getItem('garyOpenFolders') || '[]')); } catch(e) {}

  async function api(url, opts) {
    const res = await fetch(url, opts);
    if (res.status === 401) { location.href = '/login'; throw new Error('Not logged in'); }
    const data = await res.json();
    if (!res.ok || (data && data.error)) throw new Error((data && data.error) || res.statusText);
    return data;
  }

  function jsonBody(method, body) {
    return { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  }

  async function loadThreads() {
    try {
      const [threads, folders] = await Promise.all([
        api('/api/threads'),
        api('/api/folders').catch(() => []),
      ]);
      threadsCache = threads;
      foldersCache = folders;
      renderSidebar();
    } catch(e) { console.error(e); }
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function sectionLabel(text, buttonText, onButton) {
    const label = el('div', 'section-label');
    label.appendChild(el('span', '', text));
    if (buttonText) {
      const btn = el('button', 'section-btn', buttonText);
      btn.onclick = onButton;
      label.appendChild(btn);
    }
    return label;
  }

  function menuButton(onOpen) {
    const btn = el('button', 'menu-btn', '⋯');
    btn.title = 'Options';
    btn.onclick = (e) => { e.stopPropagation(); onOpen(btn); };
    return btn;
  }

  function threadItem(t, inFolder) {
    const div = el('div', 'thread-item' + (inFolder ? ' in-folder' : '') + (t.id === currentThreadId ? ' active' : ''));
    const title = el('span', 'thread-title', t.title);
    title.title = t.title;
    div.appendChild(title);
    div.appendChild(menuButton(btn => openThreadMenu(t, btn)));
    div.onclick = () => { loadThread(t.id); closeDrawer(); };
    return div;
  }

  function folderHeader(f, count) {
    const isOpen = openFolders.has(f.id);
    const div = el('div', 'folder-header');
    div.appendChild(el('span', 'folder-caret', isOpen ? '▼' : '▶'));
    const name = el('span', 'thread-title', '📁 ' + f.name);
    name.title = f.name;
    div.appendChild(name);
    div.appendChild(el('span', 'folder-count', String(count)));
    div.appendChild(menuButton(btn => openFolderMenu(f, btn)));
    div.onclick = () => toggleFolder(f.id);
    return div;
  }

  function toggleFolder(folderId) {
    if (openFolders.has(folderId)) openFolders.delete(folderId); else openFolders.add(folderId);
    try { localStorage.setItem('garyOpenFolders', JSON.stringify([...openFolders])); } catch(e) {}
    renderSidebar();
  }

  function renderSidebar() {
    if (searchQuery.length >= 2) return;  // search results own the list until cleared
    const folderIds = new Set(foldersCache.map(f => f.id));
    const pinned = threadsCache.filter(t => t.pinned);
    const unfiled = threadsCache.filter(t => !t.pinned && !folderIds.has(t.folder_id));
    LIST_IDS.forEach(id => {
      const list = document.getElementById(id);
      list.innerHTML = '';
      if (pinned.length) {
        list.appendChild(sectionLabel('📌 Pinned'));
        pinned.forEach(t => list.appendChild(threadItem(t)));
      }
      list.appendChild(sectionLabel('Folders', '+ New', () => createFolder()));
      if (!foldersCache.length) list.appendChild(el('div', 'sidebar-note', 'No folders yet.'));
      foldersCache.forEach(f => {
        const inFolder = threadsCache.filter(t => !t.pinned && t.folder_id === f.id);
        list.appendChild(folderHeader(f, inFolder.length));
        if (openFolders.has(f.id)) inFolder.forEach(t => list.appendChild(threadItem(t, true)));
      });
      list.appendChild(sectionLabel('Chats'));
      unfiled.forEach(t => list.appendChild(threadItem(t)));
    });
  }

  // -- POPUP MENU ------------------------------------------------------------

  function openMenu(anchor, items) {
    const menu = document.getElementById('popMenu');
    menu.innerHTML = '';
    items.forEach(item => {
      if (item === '-') { menu.appendChild(el('div', 'pop-divider')); return; }
      const btn = el('button', 'pop-item' + (item.className ? ' ' + item.className : ''), item.label);
      if (item.onClick) btn.onclick = (e) => { e.stopPropagation(); if (!item.keepOpen) closeMenu(); item.onClick(btn); };
      menu.appendChild(btn);
    });
    menu.classList.add('open');
    const r = anchor.getBoundingClientRect();
    const w = menu.offsetWidth, h = menu.offsetHeight;
    menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
    menu.style.top = (r.bottom + h + 8 > window.innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
  }

  function closeMenu() { document.getElementById('popMenu').classList.remove('open'); }
  document.addEventListener('click', (e) => { if (!e.target.closest('#popMenu')) closeMenu(); });

  function openThreadMenu(t, anchor) {
    openMenu(anchor, [
      { label: t.pinned ? 'Unpin' : '📌 Pin to top', onClick: () => updateThread(t.id, { pinned: !t.pinned }) },
      { label: '📁 Move to folder...', keepOpen: true, onClick: () => openMoveMenu(t, anchor) },
      { label: '✏️ Rename', onClick: () => renameThread(t) },
    ]);
  }

  function openMoveMenu(t, anchor) {
    const items = foldersCache.map(f => ({
      label: (t.folder_id === f.id ? '✓ ' : '') + f.name,
      onClick: () => updateThread(t.id, { folder_id: f.id }),
    }));
    if (!items.length) items.push({ label: 'No folders yet', className: 'muted' });
    items.push('-', { label: '+ New folder...', onClick: () => createFolder(t) });
    if (t.folder_id) items.push({ label: 'Remove from folder', onClick: () => updateThread(t.id, { folder_id: null }) });
    openMenu(anchor, items);
  }

  function openFolderMenu(f, anchor) {
    openMenu(anchor, [
      { label: '✏️ Rename folder', onClick: () => renameFolder(f) },
      { label: '🗑 Delete folder', className: 'danger', onClick: () => deleteFolder(f) },
    ]);
  }

  // -- ACTIONS ---------------------------------------------------------------

  async function updateThread(threadId, changes) {
    try { await api('/api/threads/' + threadId, jsonBody('PATCH', changes)); }
    catch(e) { alert("Couldn't update that chat: " + e.message); }
    await loadThreads();
  }

  function renameThread(t) {
    const title = prompt('Rename chat:', t.title);
    if (title !== null && title.trim()) updateThread(t.id, { title: title.trim() });
  }

  // With a thread, the new folder is created and the thread moved into it.
  async function createFolder(t) {
    const name = prompt('New folder name:');
    if (name === null || !name.trim()) return;
    try {
      const folder = await api('/api/folders', jsonBody('POST', { name: name.trim() }));
      openFolders.add(folder.id);
      try { localStorage.setItem('garyOpenFolders', JSON.stringify([...openFolders])); } catch(e) {}
      if (t) await api('/api/threads/' + t.id, jsonBody('PATCH', { folder_id: folder.id }));
    } catch(e) { alert("Couldn't create that folder: " + e.message); }
    await loadThreads();
  }

  async function renameFolder(f) {
    const name = prompt('Rename folder:', f.name);
    if (name === null || !name.trim()) return;
    try { await api('/api/folders/' + f.id, jsonBody('PATCH', { name: name.trim() })); }
    catch(e) { alert("Couldn't rename that folder: " + e.message); }
    await loadThreads();
  }

  async function deleteFolder(f) {
    if (!confirm(`Delete the folder "${f.name}"?\n\nThe chats inside won't be deleted. They'll go back to the main list.`)) return;
    try { await api('/api/folders/' + f.id, { method: 'DELETE' }); }
    catch(e) { alert("Couldn't delete that folder: " + e.message); }
    await loadThreads();
  }

  // -- SEARCH ----------------------------------------------------------------

  function onSearchInput(input) {
    document.querySelectorAll('.search-input').forEach(i => { if (i !== input) i.value = input.value; });
    searchQuery = input.value.trim();
    clearTimeout(searchTimer);
    if (searchQuery.length < 2) { renderSidebar(); return; }
    setListsTo(() => el('div', 'sidebar-note', 'Searching...'));
    searchTimer = setTimeout(runSearch, 350);
  }

  function setListsTo(build) {
    LIST_IDS.forEach(id => {
      const list = document.getElementById(id);
      list.innerHTML = '';
      [].concat(build()).forEach(node => list.appendChild(node));
    });
  }

  function highlighted(text, words) {
    const frag = document.createDocumentFragment();
    const escaped = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const parts = text.split(new RegExp('(' + escaped.join('|') + ')', 'gi'));
    parts.forEach((part, i) => frag.appendChild(i % 2 ? el('mark', '', part) : document.createTextNode(part)));
    return frag;
  }

  async function runSearch() {
    const q = searchQuery;
    let results;
    try { results = await api('/api/search?q=' + encodeURIComponent(q)); }
    catch(e) { setListsTo(() => el('div', 'sidebar-note', 'Search failed: ' + e.message)); return; }
    if (q !== searchQuery) return;  // she kept typing; a newer search is coming
    const words = q.split(/\s+/);
    setListsTo(() => {
      if (!results.length) return [el('div', 'sidebar-note', `Nothing found for "${q}".`)];
      const nodes = [sectionLabel(`${results.length}${results.length >= 40 ? '+' : ''} chats`)];
      results.forEach(r => {
        const div = el('div', 'search-result' + (r.id === currentThreadId ? ' active' : ''));
        const title = el('div', 'search-result-title');
        title.appendChild(highlighted(r.title, words));
        div.appendChild(title);
        if (r.snippet) {
          const snippet = el('div', 'search-result-snippet');
          snippet.appendChild(highlighted(r.snippet, words));
          div.appendChild(snippet);
        }
        const meta = [formatTimestamp(r.updated_at)];
        if (r.match_count) meta.unshift(r.match_count + (r.match_count === 1 ? ' match' : ' matches'));
        div.appendChild(el('div', 'search-result-meta', meta.join(' · ')));
        div.onclick = () => {
          pendingHighlight = words;
          document.querySelectorAll('.search-result').forEach(n => n.classList.remove('active'));
          div.classList.add('active');
          loadThread(r.id);
          closeDrawer();
        };
        nodes.push(div);
      });
      return nodes;
    });
  }

  // After opening a chat from search, jump to the first message containing every search word.
  function jumpToHighlight() {
    if (!pendingHighlight) return;
    const words = pendingHighlight.map(w => w.toLowerCase());
    pendingHighlight = null;
    const hit = [...document.querySelectorAll('#messages .bubble')]
      .find(b => words.every(w => b.textContent.toLowerCase().includes(w)));
    if (!hit) return;
    hit.classList.add('search-hit');
    hit.scrollIntoView({ block: 'center' });
  }

  async function loadThread(threadId) {
    currentThreadId = threadId;
    try {
      const res = await fetch('/api/threads/' + threadId + '/messages');
      if (res.status === 401) { location.href = '/login'; return; }
      const messages = await res.json();
      const container = document.getElementById('messages');
      container.innerHTML = '';
      if (messages.length === 0) {
        container.innerHTML = '<div class="empty-state" id="emptyState"><div class="icon">🎩</div><p>Say something to Gary.</p></div>';
      } else {
        messages.forEach(m => appendMessage(m.role, m.content, m.created_at));
      }
      scrollToBottom();
      jumpToHighlight();
      await loadThreads();
    } catch(e) { console.error(e); }
  }

  async function newChat() {
    try {
      const res = await fetch('/api/threads', { method: 'POST' });
      const thread = await res.json();
      currentThreadId = thread.id;
      document.getElementById('messages').innerHTML = '<div class="empty-state" id="emptyState"><div class="icon">🎩</div><p>Say something to Gary.</p></div>';
      await loadThreads();
    } catch(e) { console.error(e); }
  }

  function appendMessage(role, content, timestamp) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message ' + (role === 'user' ? 'user' : 'gary');
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🦝' : '🎩';
    const msgWrap = document.createElement('div');
    msgWrap.style.display = 'flex';
    msgWrap.style.flexDirection = 'column';
    msgWrap.style.maxWidth = '100%';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = content.replace(/[*]([^*]+)[*]/g, '<em>*$1*</em>');
    msgWrap.appendChild(bubble);
    if (timestamp) {
      const ts = document.createElement('div');
      ts.className = 'timestamp';
      ts.textContent = formatTimestamp(timestamp);
      msgWrap.appendChild(ts);
    }
    if (role !== 'user') {
      const pdfBtn = document.createElement('button');
      pdfBtn.className = 'download-pdf-btn';
      pdfBtn.textContent = 'Save as PDF';
      pdfBtn.onclick = () => downloadPDF(content);
      msgWrap.appendChild(pdfBtn);
    }
    div.appendChild(avatar);
    div.appendChild(msgWrap);
    container.appendChild(div);
    scrollToBottom();
  }

  async function downloadPDF(content) {
    try {
      const res = await fetch('/api/generate-pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: content, title: 'Gary ReDeaux' })
      });
      if (!res.ok) throw new Error('PDF generation failed');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'gary_redeaux.pdf';
      a.click();
      URL.revokeObjectURL(url);
    } catch(e) {
      console.error('PDF error:', e);
    }
  }

  function showTyping() {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message gary'; div.id = 'typing';
    const avatar = document.createElement('div');
    avatar.className = 'avatar'; avatar.textContent = '🎩';
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    div.appendChild(avatar); div.appendChild(typing);
    container.appendChild(div);
    scrollToBottom();
  }

  function hideTyping() { const el = document.getElementById('typing'); if (el) el.remove(); }
  function scrollToBottom() { const c = document.getElementById('messages'); c.scrollTop = c.scrollHeight; }
  function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
  function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

  let micSent = false;

  function toggleMic() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert('Voice input not supported in this browser. Try Chrome!');
      return;
    }
    if (isListening) { recognition.stop(); return; }
    micSent = false;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onstart = () => {
      isListening = true;
      document.getElementById('micBtn').classList.add('listening');
      document.getElementById('micBtn').textContent = '🔴';
      document.getElementById('msgInput').placeholder = 'Listening... tap 🔴 to stop';
    };
    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = 0; i < event.results.length; i++) {
        if (event.results[i].isFinal) transcript += event.results[i][0].transcript;
      }
      if (transcript.trim()) {
        document.getElementById('msgInput').value = transcript.trim();
        autoResize(document.getElementById('msgInput'));
      }
    };
    recognition.onend = () => {
      isListening = false;
      document.getElementById('micBtn').classList.remove('listening');
      document.getElementById('micBtn').textContent = '🎤';
      document.getElementById('msgInput').placeholder = 'Say something to Gary...';
      const msg = document.getElementById('msgInput').value.trim();
      if (msg && !micSent && !isLoading) { micSent = true; setTimeout(() => sendMessage(), 100); }
    };
    recognition.onerror = (e) => {
      if (e.error !== 'aborted') console.error('Speech error:', e.error);
      isListening = false;
      document.getElementById('micBtn').classList.remove('listening');
      document.getElementById('micBtn').textContent = '🎤';
      document.getElementById('msgInput').placeholder = 'Say something to Gary...';
    };
    recognition.start();
  }

  let selectedFiles = [];

  function handleFileSelect(event) {
    const files = Array.from(event.target.files).slice(0, 10);
    if (!files.length) return;
    selectedFiles = files;
    const names = files.map(f => f.name).join(', ');
    document.getElementById('filePreviewName').textContent =
      files.length === 1 ? files[0].name : `${files.length} files: ${names}`;
    document.getElementById('filePreview').style.display = 'flex';
    document.getElementById('msgInput').placeholder = 'Add a message (optional)...';
  }

  function clearFile() {
    selectedFiles = [];
    document.getElementById('fileInput').value = '';
    document.getElementById('filePreview').style.display = 'none';
    document.getElementById('msgInput').placeholder = 'Say something to Gary...';
  }

  async function sendMessage(messageOverride) {
    const input = document.getElementById('msgInput');
    const msg = messageOverride || input.value.trim();
    if (selectedFiles.length && !messageOverride) { await sendWithFiles(msg); return; }
    if (!msg || isLoading) return;
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('uploadBtn').disabled = true;
    if (!messageOverride) { input.value = ''; autoResize(input); }
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();
    appendMessage('user', msg, new Date().toISOString());
    showTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, thread_id: currentThreadId, voice: voiceEnabled })
      });
      const data = await res.json();
      hideTyping();
      if (data.error) {
        appendMessage('gary', '*Something went wrong. Gary appears to be indisposed.*', null);
        console.error('Gary error:', data.error, data.detail);
      } else {
        currentThreadId = data.thread_id;
        appendMessage('gary', data.response, new Date().toISOString());
        if (data.audio) {
          const audio = document.getElementById('audioPlayer');
          audio.src = 'data:audio/mp3;base64,' + data.audio;
          audio.play();
        }
        await loadThreads();
        setTimeout(loadThreads, 4000);  // pick up the auto-generated title
      }
    } catch(e) {
      hideTyping();
      appendMessage('gary', '*Something went wrong. Gary appears to be indisposed.*', null);
    }
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('uploadBtn').disabled = false;
    scrollToBottom();
  }

  async function sendWithFiles(caption) {
    if (!selectedFiles.length || isLoading) return;
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('uploadBtn').disabled = true;
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();
    const fileNames = selectedFiles.map(f => f.name).join(', ');
    const displayMsg = caption
      ? `[${selectedFiles.length > 1 ? selectedFiles.length + ' files' : selectedFiles[0].name}] ${caption}`
      : `[${selectedFiles.length > 1 ? selectedFiles.length + ' files: ' + fileNames : selectedFiles[0].name}]`;
    appendMessage('user', displayMsg, new Date().toISOString());
    showTyping();
    const formData = new FormData();
    selectedFiles.forEach(f => formData.append('files', f));
    formData.append('message', caption || '');
    formData.append('thread_id', currentThreadId || '');
    formData.append('voice', voiceEnabled ? 'true' : 'false');
    const fileInput = document.getElementById('msgInput');
    fileInput.value = '';
    autoResize(fileInput);
    clearFile();
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: formData });
      const data = await res.json();
      hideTyping();
      if (data.error) {
        appendMessage('gary', `*Gary frowns at the files. ${data.error}*`, null);
      } else {
        currentThreadId = data.thread_id;
        appendMessage('gary', data.response, new Date().toISOString());
        if (data.audio) {
          const audio = document.getElementById('audioPlayer');
          audio.src = 'data:audio/mp3;base64,' + data.audio;
          audio.play();
        }
        await loadThreads();
        setTimeout(loadThreads, 4000);  // pick up the auto-generated title
      }
    } catch(e) {
      hideTyping();
      appendMessage('gary', '*Something went wrong. Gary appears to be indisposed.*', null);
    }
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('uploadBtn').disabled = false;
    scrollToBottom();
  }

  loadThreads();

  // Notification links (the morning brief) open a specific chat: /?thread=123
  const linkedThread = Number(new URLSearchParams(location.search).get('thread'));
  if (linkedThread) {
    history.replaceState(null, '', '/');
    loadThread(linkedThread);
  }
</script>
